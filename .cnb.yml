# HuaRec 花录 — Chrome 扩展发版流水线
#
# 流程说明：
#   1. master push     : 每次项目更新，打包浏览器插件 zip 并上传为 Commit 附件，
#                        用户可在仓库「制品 / 附件」中直接下载最新构建
#   2. tag_push(v*)    : 打包 zip，直接挂载为 Release 附件，并创建 Release
#                       （Release 页面即可直接下载 zip，无需跳转）
#   3. CI 失败自动修复  : 上述流水线任一环节报错时，failStages 自动唤醒 NPC
#                        读取失败日志、尝试修复并推送新提交，全程无需人工介入
#
# zip 内只保留浏览器插件运行所需文件（manifest.json / js / html / css /
# icons / 壁纸 / 第三方库），剔除开发脚本、原始素材、文档等无关内容。
#
# 附件上传统一使用官方插件 cnbcool/attachments（Node 镜像，自带上传逻辑），
# 替代原先手写 curl 调用 REST API 的方式，更健壮且无需在构建环境安装 curl。

include:
  - .ci/release-scripts.yml
  - .ci/auto-fix.yml

# ── master 分支：每次更新打包插件 zip，作为附件供用户直接下载 ──
master:
  push:
    - name: pack-extension
      stages:
        - name: install-deps
          script: |
            apt-get update && apt-get install -y --no-install-recommends zip
        - name: pack-extension-zip
          script: !reference [.pack-script]
        # 上传为 Commit 附件（仓库「制品」中可见，下载链接永久有效）
        - name: upload-zip-asset
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./*.zip"
          exports:
            FILES: FILES
        - name: print-download-url
          script: |
            VERSION=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
            echo ">>> 附件已上传: $FILES"
            echo ">>> 下载地址: https://$CNB_WEB_HOST/$CNB_REPO_SLUG/-/commit/$CNB_COMMIT/huarec-$VERSION.zip"
      # ── CI 报错自动处理：失败后唤醒 NPC 自动诊断修复 ──
      failStages:
        - name: auto-fix-ci-failure
          type: npc:go
          options:
            maxTurns: 30
            systemPrompt: !reference [.auto-fix-system-prompt]
            userPrompt: !reference [.auto-fix-user-prompt]

# ── Tag(v*)：打包 + zip 直接挂载为 Release 附件 + 创建 Release ──
"$":
  tag_push:
    - name: release-extension
      stages:
        - name: install-deps
          script: |
            apt-get update && apt-get install -y --no-install-recommends zip
        - name: pack-extension-zip
          script: !reference [.pack-script]
        - name: write-release-notes
          script: |
            VERSION=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
            cat > RELEASE_NOTES.md <<EOF
            ## HuaRec 花录 ${CNB_BRANCH}

            Chrome 浏览器扩展安装包 \`huarec-${VERSION}.zip\` 已挂载在本 Release 的附件中，可直接下载。

            ### 安装方式
            1. 下载并解压 zip 到本地目录（解压后目录内应直接包含 \`manifest.json\`）
            2. 打开 Chrome，访问 \`chrome://extensions/\`
            3. 开启右上角「开发者模式」
            4. 点击「加载已解压的扩展程序」，选择解压后的目录
            EOF
        # 关键顺序：先创建 Release，再把 zip 作为 Release 附件上传，
        # 这样 Release 页面会直接展示 zip 供用户下载
        - name: create-release
          type: git:release
          options:
            tag: $CNB_BRANCH
            descriptionFromFile: RELEASE_NOTES.md
        - name: upload-release-asset
          image: cnbcool/attachments:latest
          settings:
            # tag_push 事件下插件默认取 $CNB_BRANCH 作为 tag，挂到对应 Release
            attachments:
              - "./*.zip"
        - name: print-download-url
          script: |
            echo ">>> Release 已创建: https://$CNB_WEB_HOST/$CNB_REPO_SLUG/-/releases"
            echo ">>> zip 已作为 Release($CNB_BRANCH) 附件挂载，可在 Release 页直接下载"
      # ── CI 报错自动处理：失败后唤醒 NPC 自动诊断修复 ──
      failStages:
        - name: auto-fix-ci-failure
          type: npc:go
          options:
            maxTurns: 30
            systemPrompt: !reference [.auto-fix-system-prompt]
            userPrompt: !reference [.auto-fix-user-prompt]
