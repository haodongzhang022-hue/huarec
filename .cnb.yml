# HuaRec 花录 — Chrome 扩展全自动发版流水线
#
# 核心目标（对齐 huashu-design 仓库体验）：非常自动、非常醒目。
#
#   1. master push（每次更新）:
#        运行 scripts/release-latest.sh：
#          自动递增 patch 版本号（manifest.json 为唯一版本源）
#          → 打包插件 zip（仅插件运行所需文件）
#          → 创建/更新稳定 tag（latest）的 Release，zip 作为附件覆盖上传
#          → Release 描述维护最新版本 + 安装指引 + 更新日志 + 永久下载直链
#          → 版本号 bump 自动提交回 master（[skip ci]，不触发新一轮流水线）
#      用户打开仓库「发行版 / Releases」页即可看到置顶的最新版本与醒目 zip
#      下载按钮，全程零人工操作。
#
#   2. tag_push(v*)（手动打 tag 发正式版）:
#        打包 zip → 创建该 tag 的 Release → zip 挂载为 Release 附件，
#        用于里程碑式正式版本，与 latest 自动通道互不干扰。
#
#   3. CI 失败自动修复:
#        上述流水线任一环节报错时，failStages 自动唤醒 NPC 读取失败日志、
#        尝试修复并推送新提交，全程无需人工介入。
#
# 附件上传走 cnb CLI（post-release-asset-upload-url → PUT → 确认），
# 即 huashu-design 仓库实测可靠的方案，支持同名覆盖，永保 latest 附件为最新版。

include:
  - .ci/auto-fix.yml

# ── master push：全自动发版（版本号递增 + latest Release + zip 附件覆盖）──
master:
  push:
    - name: auto-release
      docker:
        # 从 Dockerfile 构建（node:22-slim + git/curl/jq/zip/cnb-cli），平台自动缓存
        build:
          dockerfile: ./Dockerfile
      stages:
        - name: auto-release-latest
          script: bash scripts/release-latest.sh
      # ── CI 报错自动处理：失败后唤醒 NPC 自动诊断修复 ──
      failStages:
        - name: auto-fix-ci-failure
          type: npc:go
          options:
            maxTurns: 30
            systemPrompt: !reference [.auto-fix-system-prompt]
            userPrompt: !reference [.auto-fix-user-prompt]

# ── Tag(v*)：手动打 tag 发正式版（里程碑版本，与 latest 自动通道并存）──
"$":
  tag_push:
    - name: release-extension
      docker:
        build:
          dockerfile: ./Dockerfile
      stages:
        - name: pack-extension-zip
          script: |
            set -e
            VERSION=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
            echo ">>> manifest version: $VERSION"
            STAGE_DIR="huarec-$VERSION"
            ZIP_NAME="huarec-$VERSION.zip"
            rm -rf "$STAGE_DIR" "$ZIP_NAME"
            mkdir -p "$STAGE_DIR"
            cp manifest.json background.js offscreen.html offscreen.js permission.html permission.js "$STAGE_DIR"/
            cp -r content editor icons lib popup assets "$STAGE_DIR"/
            rm -f "$STAGE_DIR/icons/make_icons.py"
            rm -rf "$STAGE_DIR/assets/wallpapers/_raw"
            (cd "$STAGE_DIR" && zip -q -r "../$ZIP_NAME" .)
            ls -lh "$ZIP_NAME"
        # 先创建 Release，再把 zip 挂载为 Release 附件，
        # Release 页面会直接展示醒目的 zip 下载
        - name: create-release
          type: git:release
          options:
            tag: $CNB_BRANCH
            description: "HuaRec 花录 $CNB_BRANCH 正式版。zip 安装包已挂载在本 Release 附件中，下载解压后于 chrome://extensions/ 加载即可。"
        - name: upload-release-asset
          image: cnbcool/attachments:latest
          settings:
            # tag_push 事件下插件默认取 $CNB_BRANCH 作为 tag，挂到对应 Release
            attachments:
              - "./*.zip"
        - name: print-download-url
          script: |
            echo ">>> Release 已创建: https://$CNB_WEB_HOST/$CNB_REPO_SLUG/-/releases"
            echo ">>> zip 已作为 Release($CNB_BRANCH) 附件挂载，可在 Release 页直接下载"
      # ── CI 报错自动处理：失败后唤醒 NPC 自动诊断修复 ──
      failStages:
        - name: auto-fix-ci-failure
          type: npc:go
          options:
            maxTurns: 30
            systemPrompt: !reference [.auto-fix-system-prompt]
            userPrompt: !reference [.auto-fix-user-prompt]
