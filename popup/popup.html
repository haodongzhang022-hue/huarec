<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <img src="../icons/icon48.png" alt="" width="22" height="22" />
        <span>HuaRec <em>花录</em></span>
      </div>
      <button id="library" class="ghost" title="打开录制库">录制库</button>
    </header>

    <!-- 待机视图:一个主按钮 + 两组录制选项;美化/运镜都在录完后的编辑器里调 -->
    <section id="idle">
      <button id="start" class="start">
        <span class="ring"></span>
        开始录制
      </button>

      <div class="card">
        <label class="opt">
          <span class="ol">标签页声音</span>
          <input type="checkbox" id="audio" checked /><span class="sw-t"></span>
        </label>
        <label class="opt">
          <span class="ol">麦克风旁白<small>独立成轨,音量录完再调 · 外放建议戴耳机</small></span>
          <input type="checkbox" id="mic" /><span class="sw-t"></span>
        </label>
        <label class="opt">
          <span class="ol">摄像头小窗<small>位置 / 大小 / 美颜,全部录完再调</small></span>
          <input type="checkbox" id="camera" /><span class="sw-t"></span>
        </label>
        <video id="camPreview" autoplay muted playsinline hidden></video>
      </div>

      <div class="card">
        <div class="opt col">
          <div class="opt-top">
            <span class="ol">光标</span>
            <div class="seg" id="cursorSeg">
              <button data-cur="raw">原始</button>
              <button data-cur="enhance" class="on">美化</button>
              <button data-cur="smooth">平滑</button>
            </div>
          </div>
          <small id="curHint"></small>
        </div>
      </div>

      <p class="hint"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> 随时起录 / 停止 · 背景、运镜、剪辑都在录完后的编辑器里</p>
    </section>

    <!-- 录制中视图:计时 + 暂停 + 停止,全部留在工具栏弹窗里 -->
    <section id="live" hidden>
      <div class="live-head">
        <span class="livedot" id="livedot"></span>
        <span class="live-time" id="liveTime">0:00</span>
        <span id="livetext" class="live-tag">录制中</span>
      </div>
      <div class="live-actions">
        <button id="pause" class="ctl">暂停</button>
        <button id="stop" class="stop">停止并编辑</button>
      </div>
      <button id="switchHere" class="ghost-line" hidden>⇄ 把录制切到当前标签页</button>
      <button id="stopDl" class="ghost-line">停止 · 直接下载源片(不修)</button>
      <p class="hint">关掉弹窗不会停止录制 · 切换标签页会自动跟录 · <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> 随时停</p>
    </section>

    <p id="error" class="error" hidden></p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
