# Release 流水线公共脚本（被 .cnb.yml include 后通过 !reference 引用）
# pack-script: 仅打包浏览器插件运行所需文件为 zip

.pack-script: |
  set -e
  VERSION=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
  echo ">>> manifest version: $VERSION"
  STAGE_DIR="huarec-$VERSION"
  ZIP_NAME="huarec-$VERSION.zip"
  rm -rf "$STAGE_DIR" "$ZIP_NAME"
  mkdir -p "$STAGE_DIR"
  # 仅拷贝浏览器插件相关文件
  cp manifest.json background.js offscreen.html offscreen.js permission.html permission.js "$STAGE_DIR"/
  cp -r content editor icons lib popup assets "$STAGE_DIR"/
  # 剔除与插件运行无关的内容
  rm -f "$STAGE_DIR/icons/make_icons.py"
  rm -rf "$STAGE_DIR/assets/wallpapers/_raw"
  cd "$STAGE_DIR"
  zip -r "../$ZIP_NAME" .
  cd ..
  ls -lh "$ZIP_NAME"

# bump-version: master push 时自动递增 patch 版本号（manifest.json 为唯一版本源）
# 输出变量 NEXT_VERSION / NEXT_TAG 供后续 stage 使用（通过写入 /tmp/release.env）
.bump-version-script: |
  set -e
  OLD=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
  MAJOR=$(echo "$OLD" | cut -d. -f1)
  MINOR=$(echo "$OLD" | cut -d. -f2)
  PATCH=$(echo "$OLD" | cut -d. -f3)
  PATCH=$((PATCH + 1))
  NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
  NEXT_TAG="v$NEXT_VERSION"
  # 替换 manifest.json 中的版本号（仅 version 字段那一行）
  sed -i "s/\"version\": \"$OLD\"/\"version\": \"$NEXT_VERSION\"/" manifest.json
  grep '"version"' manifest.json
  echo "NEXT_VERSION=$NEXT_VERSION" > /tmp/release.env
  echo "NEXT_TAG=$NEXT_TAG" >> /tmp/release.env
  echo ">>> version bumped: $OLD -> $NEXT_VERSION (tag: $NEXT_TAG)"

# release-notes: 基于最近 10 条提交自动生成 Release 更新说明
.release-notes-script: |
  set -e
  . /tmp/release.env
  {
    echo "## HuaRec 花录 $NEXT_TAG"
    echo ""
    echo "Chrome 浏览器扩展安装包 \`huarec-$NEXT_VERSION.zip\` 已挂载在本 Release 的附件中，可直接下载。"
    echo ""
    echo "### 本次更新"
    git log -10 --pretty=format:"- %s" | grep -v "自动发版" || git log -1 --pretty=format:"- %s"
    echo ""
    echo "### 安装方式"
    echo "1. 下载并解压 zip 到本地目录（解压后目录内应直接包含 \`manifest.json\`）"
    echo "2. 打开 Chrome，访问 \`chrome://extensions/\`"
    echo "3. 开启右上角「开发者模式」"
    echo "4. 点击「加载已解压的扩展程序」，选择解压后的目录"
  } > RELEASE_NOTES.md
  echo ">>> RELEASE_NOTES.md 已生成:"
  cat RELEASE_NOTES.md
