# Release 流水线公共脚本（被 .cnb.yml include 后通过 !reference 引用）
# pack-script: 仅打包浏览器插件运行所需文件为 zip
# upload-script: 将 zip 上传为 Commit 附件并导出附件地址

.pack-script: |
  set -e
  VERSION=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
  echo ">>> manifest version: $VERSION"
  STAGE_DIR="huarec-$VERSION"
  ZIP_NAME="huarec-$VERSION.zip"
  rm -rf "$STAGE_DIR" "$ZIP_NAME"
  mkdir -p "$STAGE_DIR"
  # 仅拷贝浏览器插件相关文件
  cp manifest.json background.js offscreen.html offscreen.js permission.html permission.js "$STAGE_DIR"/
  cp -r content editor icons lib popup assets "$STAGE_DIR"/
  # 剔除与插件运行无关的内容
  rm -f "$STAGE_DIR/icons/make_icons.py"
  rm -rf "$STAGE_DIR/assets/wallpapers/_raw"
  cd "$STAGE_DIR"
  zip -r "../$ZIP_NAME" .
  cd ..
  ls -lh "$ZIP_NAME"

.upload-script: |
  set -e
  VERSION=$(grep -o '"version"[^,]*' manifest.json | cut -d'"' -f4)
  ZIP_NAME="huarec-$VERSION.zip"
  echo ">>> 上传 $ZIP_NAME 为 Commit 附件"
  FILE_SIZE=$(stat -c%s "$ZIP_NAME")
  # 1. 通过 API 获取上传预签名 URL（sha 在 URL 路径，asset_name/size 为必填字段）
  UPLOAD_JSON=$(curl -fsS -X POST \
    -H "Authorization: Bearer $CNB_TOKEN" \
    -H "Content-Type: application/json" \
    -H "Accept: application/vnd.cnb.api+json" \
    -d "{\"asset_name\":\"$ZIP_NAME\",\"size\":$FILE_SIZE}" \
    "${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/git/commit-assets/${CNB_COMMIT}/asset-upload-url")
  UPLOAD_URL=$(printf '%s' "$UPLOAD_JSON" | sed -n 's/.*"upload_url":"\([^"]*\)".*/\1/p')
  VERIFY_URL=$(printf '%s' "$UPLOAD_JSON" | sed -n 's/.*"verify_url":"\([^"]*\)".*/\1/p')
  [ -n "$UPLOAD_URL" ] && [ -n "$VERIFY_URL" ] || { echo "!!! 解析上传地址失败: $UPLOAD_JSON"; exit 1; }
  # 2. PUT 上传文件
  curl -fsS -X PUT -T "$ZIP_NAME" "$UPLOAD_URL"
  # 3. 确认上传（verify_url 已含 ?ttl=0 查询参数）
  curl -fsS -X POST \
    -H "Authorization: Bearer $CNB_TOKEN" \
    -H "Accept: application/vnd.cnb.api+json" \
    "$VERIFY_URL"
  ASSET_URL="https://$CNB_WEB_HOST/$CNB_REPO_SLUG/-/commit/$CNB_COMMIT/$ZIP_NAME"
  echo ">>> 附件地址: $ASSET_URL"
  echo "##[set-output ASSET_URL=$ASSET_URL]"
