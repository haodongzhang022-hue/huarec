<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>HuaRec — 摄像头授权</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #FF6B4A; --bg: #16161A; --panel: #1f1f25; --text: #f5f5f7; --dim: #9a9aa2; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 380px; background: var(--panel); border-radius: 18px; padding: 34px 32px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
    h1 { font-size: 18px; margin-bottom: 10px; }
    p { font-size: 13px; color: var(--dim); line-height: 1.7; }
    video {
      display: none; width: 160px; height: 160px; object-fit: cover; border-radius: 50%;
      margin: 20px auto 0; transform: scaleX(-1); filter: brightness(1.05) saturate(1.06);
      box-shadow: 0 8px 26px rgba(0,0,0,0.45), 0 0 0 2px rgba(255,255,255,0.16);
    }
    video.on { display: block; }
    button {
      all: unset; cursor: pointer; margin-top: 22px; padding: 12px 26px; border-radius: 11px;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
    }
    button:hover { background: #ff8163; }
    .ok { color: #7ed99a; margin-top: 18px; font-size: 13px; display: none; }
    .ok.on { display: block; }
    .fail { color: #ff9a86; margin-top: 18px; font-size: 12.5px; display: none; line-height: 1.7; }
    .fail.on { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>允许 HuaRec 使用摄像头</h1>
    <p>授权一次即可。之后录制时勾选「同时录制摄像头」,<br/>就能把你的画面录成独立小窗,位置、大小、美颜录完再调。</p>
    <video id="pv" autoplay muted playsinline></video>
    <button id="ask">请求摄像头权限</button>
    <p class="ok" id="ok">✓ 授权完成。关掉这一页,点工具栏的 HuaRec 图标开始录制。</p>
    <p class="fail" id="fail">权限被拒绝了。请点地址栏左侧的 🎥 / 设置图标,把摄像头改为「允许」,然后再点上面的按钮重试。</p>
  </div>
  <script src="permission.js"></script>
</body>
</html>
